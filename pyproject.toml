[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyglot-media-workbench"
version = "0.1.0"
description = "Local multilingual dual-ASR, diarization, visual review and original-audio learning media"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "vendor/3d-speaker/LICENSE"]
authors = [{name = "Polyglot Media Workbench contributors"}]
dependencies = []

[project.optional-dependencies]
asr = ["faster-whisper>=1.2.1,<2", "qwen-asr==0.0.6", "soundfile>=0.13,<1", "numpy>=1.26,<3", "transformers==4.57.6"]
diar = ["modelscope>=1.30,<2", "funasr>=1.3,<2", "scikit-learn>=1.3,<2", "scipy>=1.11,<2", "fastcluster>=1.2.6,<3", "kaldiio>=2.18,<3", "PyYAML>=6,<7", "pandas>=2,<4", "torchaudio>=2.6,<2.12", "addict>=2.4,<3", "datasets>=2.19,<5", "simplejson>=3.19,<5", "sortedcontainers>=2.4,<3"]
vision = ["Pillow>=10,<13", "opencv-python>=4.8,<5", "rapidocr-onnxruntime>=1.3,<2", "onnxruntime>=1.17,<2", "torchvision>=0.21,<0.27", "transformers==4.57.6", "accelerate>=1.4,<2", "timm>=1.0,<2", "einops>=0.8,<1", "sentencepiece>=0.2,<1"]
documents = ["python-docx>=1.1,<2", "python-pptx>=1.0,<2", "Pillow>=10,<13"]
download = ["yt-dlp>=2026.1"]
all = ["polyglot-media-workbench[asr,diar,vision,documents,download]"]
dev = ["ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
media-workbench = "media_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
